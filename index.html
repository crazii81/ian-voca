<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Word Hop">
<meta name="theme-color" content="#24876a">
<title>Ian's Word Hop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%98%3C/text%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one column "trail" — today's day up top, then zoo / streak / tricky words, then the day path; one big card per word in learn and test */
:root{
  --bg:#eef6f9; --card:#ffffff; --ink:#16324a; --muted:#587086; --line:#d4e2eb;
  --gum:#24876a; --gum-soft:#dcf1e8; --ocean:#1d6fc2; --ocean-soft:#dcebfa;
  --sun:#f6b41e; --sun-soft:#fff2cc; --coral:#d9483d; --coral-soft:#fde3e0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Andika","Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1b26; --card:#162736; --ink:#e7f0f6; --muted:#9bb0c1; --line:#2a3f51;
  --gum:#4cc193; --gum-soft:#173b30; --ocean:#62a9f2; --ocean-soft:#16304a;
  --sun:#ffcd55; --sun-soft:#3a3016; --coral:#ff7d70; --coral-soft:#43221f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1b26; --card:#162736; --ink:#e7f0f6; --muted:#9bb0c1; --line:#2a3f51;
  --gum:#4cc193; --gum-soft:#173b30; --ocean:#62a9f2; --ocean-soft:#16304a;
  --sun:#ffcd55; --sun-soft:#3a3016; --coral:#ff7d70; --coral-soft:#43221f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ocean);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:30px;color:var(--gum)}
.brand small{display:block;font-family:var(--body);color:var(--muted);font-size:14px;font-weight:400}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sun-soft);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.cloud{background:var(--ocean-soft);font-weight:400;font-size:14px}
.panel.signin{border-color:var(--ocean)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--ocean);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.green{background:var(--gum)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#1c1606}
.btn.big{font-size:20px;padding:14px 26px}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:2px solid var(--line);background:var(--card);border-radius:12px;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.note{font-size:14px;color:var(--muted);margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:20px}

/* today */
.today{background:var(--card);border:3px solid var(--gum);border-radius:24px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.today .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gum);font-weight:700}
.today h2{font-size:32px}
.today p{margin:2px 0 8px;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--gum-soft);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--gum);border-radius:99px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* zoo preview + calendar */
.zoo-strip{display:flex;gap:6px;flex-wrap:wrap;font-size:30px;line-height:1}
.zoo-strip .lock{opacity:.25;filter:grayscale(1)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.cal b{color:var(--muted);font-weight:700}
.cal span{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted)}
.cal span.on{background:var(--gum);color:#fff;font-weight:700}
.cal span.today{outline:2px solid var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--coral-soft);border-radius:999px;padding:2px 10px;font-weight:700;font-size:15px}
.chips span small{color:var(--muted);font-weight:400;margin-left:4px}

/* day path */
details.level{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:4px 16px}
details.level summary{cursor:pointer;padding:12px 0;font-family:var(--display);font-size:22px;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.level summary::-webkit-details-marker{display:none}
details.level summary span{font-family:var(--body);font-size:14px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding-bottom:14px}
.day{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 8px 6px;text-align:left;display:flex;flex-direction:column;gap:0;min-height:86px}
.day:hover{border-color:var(--ocean)}
.day .n{font-family:var(--display);font-size:19px;color:var(--ocean);line-height:1.1}
.day .t{font-size:12px;color:var(--muted);line-height:1.25;flex:1}
.day.plan{background:var(--sun-soft)}
.day.review{background:var(--coral-soft);border-style:dashed}
.day.review .n{color:var(--coral)}
.day.done{border-color:var(--gum);background:var(--gum-soft)}
.day.next{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.stars{display:flex;gap:1px}
.stars svg{width:16px;height:16px}
.settings label{font-size:14px;color:var(--muted);display:grid;gap:4px}
.settings select,.settings input[type=range]{width:100%;font:inherit}
.settings select{padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
details.settings summary{cursor:pointer;font-family:var(--display);font-size:20px}

/* learn */
.tabs{display:flex;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:10px;font-weight:700;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--ocean);color:#fff}
.list{display:grid;gap:12px}
.wcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.wcard.playing{border-color:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.wcard .w{font-family:var(--display);font-size:28px;color:var(--gum);line-height:1}
.wcard .m{font-weight:700}
.wcard .ex{grid-column:1/-1;font-family:var(--read);font-size:19px;margin:0;min-width:0}
.wcard .ex b{color:var(--ocean)}

/* test */
.track{position:relative;height:74px;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.track .ground{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--gum-soft)}
.track .flag{position:absolute;right:12px;bottom:14px;width:26px;height:40px}
.roo{position:absolute;bottom:12px;left:8px;width:52px;height:52px;transition:left .5s cubic-bezier(.3,1.4,.6,1)}
.roo.hop svg{animation:hop .5s ease}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px) rotate(-8deg)}}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.meaning{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.meaning strong{display:block;font-family:var(--display);font-size:32px;color:var(--ink);letter-spacing:0;text-transform:none;line-height:1.15;margin-top:2px}
.sentence{font-family:var(--read);font-size:24px;line-height:1.5;margin:0;background:var(--bg);border-radius:14px;padding:14px 16px}
.blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--ocean);color:var(--ocean);font-weight:700;padding:0 4px;text-align:center}
.blank.ok{color:var(--gum);border-color:var(--gum)}
.blank.bad{color:var(--coral);border-color:var(--coral)}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{flex:1 1 200px;min-width:0;font-family:var(--read);font-size:24px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.answer input.ok{border-color:var(--gum);background:var(--gum-soft)}
.answer input.bad{border-color:var(--coral);background:var(--coral-soft)}
.feedback{min-height:28px;font-weight:700;margin:0}
.feedback.ok{color:var(--gum)} .feedback.bad{color:var(--coral)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.streak{color:var(--coral);font-weight:800}
.result{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .big{font-family:var(--display);font-size:56px;color:var(--gum);line-height:1;font-variant-numeric:tabular-nums}
.result .stars svg{width:44px;height:44px}
.miss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.miss span{background:var(--coral-soft);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:700}
.newpal{background:var(--sun-soft);border:3px dashed var(--sun);border-radius:20px;padding:14px 18px;display:flex;gap:14px;align-items:center;text-align:left;max-width:460px}
.newpal .e{font-size:56px;line-height:1}
.newpal .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--coral)}

/* zoo page */
.zoo{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pal{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.pal .e{font-size:52px;line-height:1.1}
.pal h4{margin:0;font-family:var(--display);font-size:18px;line-height:1.1}
.pal p{margin:0;font-size:13px;color:var(--muted);line-height:1.35}
.pal.locked .e{filter:grayscale(1) brightness(0);opacity:.18}
.pal.locked h4{color:var(--muted)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:480px){.wcard .w{font-size:24px}.sentence{font-size:20px}.answer input{font-size:20px}.meaning strong{font-size:26px}.brand h1{font-size:26px}.today{grid-template-columns:1fr}.today .roo-big{display:none}.today h2{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

function parseUnits(txt){const out=[];let u=0;txt.split("\n").forEach(l=>{l=l.trim();if(!l)return;if(l.startsWith("## ")){u=+l.slice(3);return}const p=l.split("|");out.push({w:p[0],m:p[1],ex:p[2],alt:p[3]||"",unit:u})});return out}
function chunk(words,prefix,level){const out=[];for(let i=0;i<words.length;i+=10){const ws=words.slice(i,i+10);const a=ws[0].unit,b=ws[ws.length-1].unit;
  out.push({id:prefix+(i/10),level,kind:"book",label:a===b?`Unit ${a}`:`Unit ${a}–${b}`,words:ws})}return out}
function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}

const LEARN=[],COURSE=[];
(()=>{const r=rng(20261009);const seg=L1.length/PLANSETS.length;const slots=PLANSETS.map((_,k)=>Math.floor(k*seg+r()*seg));
  L1.forEach((s,i)=>{LEARN.push(s);PLANSETS.forEach((p,k)=>{if(slots[k]===i)LEARN.push(p)})});L2.forEach(s=>LEARN.push(s));

  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=voice?voice.lang:"en-AU"; if(voice)u.voice=voice; u.rate=saved.rate;
  if(onend){u.onend=onend;u.onerror=onend}
  speechSynthesis.speak(u);
}
function stopSpeak(){if(hasTTS)speechSynthesis.cancel();readingAll=false}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#f6b41e","#24876a","#1d6fc2","#d9483d","#7cc7ff"];
  const p=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.3,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*5)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.r+=.1;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore()});if(++t<200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

function accountHTML(){

  <details class="level"${nx.level===2?" open":""}><summary>Level 2 <span>Bricks 3100 · ${lvDone(2)}/${lv(2).length}</span></summary><div class="days">${lv(2).map(tile).join("")}</div></details>

    :'<p class="note">이 브라우저는 읽어주기를 지원하지 않아요. Chrome이나 Safari에서 열어 주세요.</p>'}

function renderDay(){
  const s=setById(setId);

function renderStudy(){
  const ws=setById(setId).words;
  $("#pane").innerHTML=`
  <div class="row" style="margin-bottom:12px"><button class="btn green" id="readAll">${SPK} Read all ${ws.length}</button><span class="note">단어 → 예문 순서로 읽어요. 따라 말해 보세요!</span></div>
  <div class="list">${ws.map((x,i)=>{const f=findForm(x.w,x.ex);const ex=f.idx>=0?esc(x.ex.slice(0,f.idx))+"<b>"+esc(f.form)+"</b>"+esc(x.ex.slice(f.idx+f.form.length)):esc(x.ex);
    return `<article class="wcard" id="c${i}"><div><div class="w">${esc(x.w)}</div><div class="m">${esc(x.m)}</div></div>
    <div><button class="icon-btn" data-sw="${i}" aria-label="Say ${esc(x.w)}">${SPK}</button></div>
    <p class="ex">${ex} <button class="icon-btn" style="width:40px;height:40px;vertical-align:middle;margin-left:4px" data-se="${i}" aria-label="Read sentence">${SPK}</button></p></article>`}).join("")}</div>
  <div class="row" style="margin-top:16px"><button class="btn" id="goTest">Ready? Take the test →</button></div>`;
  app.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{readingAll=false;clearPlaying();speak(ws[+b.dataset.sw].w)});
  app.querySelectorAll("[data-se]").forEach(b=>b.onclick=()=>{readingAll=false;clearPlaying();speak(ws[+b.dataset.se].ex)});
  $("#goTest").onclick=()=>{stopSpeak();mode="test";T=null;renderDay();scrollTo(0,0)};
  $("#readAll").onclick=()=>{
    if(readingAll){stopSpeak();clearPlaying();return}
    readingAll=true;let i=0;
    const step=()=>{clearPlaying();if(!readingAll||i>=ws.length){readingAll=false;return}
      const c=$("#c"+i);if(!c){readingAll=false;return}c.classList.add("playing");c.scrollIntoView({block:"nearest",behavior:"smooth"});
      const x=ws[i++];speak(x.w,()=>{if(!readingAll)return;setTimeout(()=>speak(x.ex,()=>setTimeout(step,500)),350)})};
    step();
  };
}
function clearPlaying(){app.querySelectorAll(".wcard.playing").forEach(c=>c.classList.remove("playing"))}

/* ---------- test: meaning + sentence with a blank, spell the word ---------- */
const wkey=(sid,w)=>sid+":"+w;
function newTest(list){return {items:shuffle(list).map(x=>({...x,ans:findForm(x.w,x.ex)})),i:0,score:0,streak:0,best:0,miss:[],state:"ask",retry:false,starsBefore:totalStars()}}
function renderTest(){
  if(!T){
    const cur=setById(setId);
    if(setId==="mix"){const pool=[];LEARN.forEach(s=>{if(saved.stars[s.id]!=null)s.words.forEach(w=>pool.push({...w,sid:s.id,from:"Day "+s.day}))});T=newTest(shuffle(pool).slice(0,10))}
    else if(cur&&cur.kind==="review"){
      const pool=cur.covers.flatMap(s=>s.words.map(w=>({...w,sid:s.id,from:"Day "+s.day})));
      const tricky=shuffle(pool.filter(w=>saved.wrong[wkey(w.sid,w.w)])),rest=shuffle(pool.filter(w=>!saved.wrong[wkey(w.sid,w.w)]));
      T=newTest(tricky.concat(rest).slice(0,10))}
    else if(setId==="tricky"){const wl=wrongList().slice(0,10);T=newTest(wl.map(x=>{const s=setById(x.sid);const w=s&&s.words.find(y=>y.w===x.w);return w?{...w,sid:x.sid,from:"Day "+s.day}:null}).filter(Boolean))}
    else T=newTest(setById(setId).words.map(w=>({...w,sid:setId})));
    if(!T.items.length){go("home");return}
  }
  if(T.i>=T.items.length)return renderResult();
  const q=T.items[T.i],n=T.items.length;
  const pos=8+(T.i/n)*78;
  const before=esc(q.ex.slice(0,q.ans.idx)),after=esc(q.ex.slice(q.ans.idx+q.ans.form.length));
  $("#pane").innerHTML=`
  <div class="track" aria-hidden="true"><div class="ground"></div><div class="flag">${FLAG}</div><div class="roo" id="roo" style="left:${pos}%">${ROO}</div></div>
  <section class="qcard">
    <div class="qmeta"><span>Question ${T.i+1} / ${n}${q.from&&(setId in{mix:1,tricky:1}||setId[0]==="r")?" · "+q.from:""}</span><span>Score ${T.score}${T.streak>=2?` · <span class="streak">${T.streak} in a row!</span>`:""}</span></div>
    <div class="meaning">뜻 · Meaning<strong>${esc(q.m.replace(/\s*\(호주:[^)]*\)/,""))}</strong></div>
    <p class="sentence" id="sent">${before}<span class="blank" id="blank">______</span>${after}</p>
    <div class="answer">
      <input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Type the word" aria-label="Your answer">
      <button class="btn" id="check">Check</button>
    </div>
    <p class="feedback" id="fb" aria-live="polite"></p>
  </section>`;
  const inp=$("#ans");inp.focus({preventScroll:true});
  const finish=()=>{T.state="done";$("#check").textContent=T.i+1<n?"Next →":"See result";inp.readOnly=true;$("#check").focus({preventScroll:true})};
  const check=()=>{
    if(T.state==="done"){T.i++;T.state="ask";T.retry=false;renderTest();return}
    const v=inp.value.trim().toLowerCase();if(!v)return;
    const ok=[q.ans.form,q.w,q.alt].filter(Boolean).map(s=>s.toLowerCase()).includes(v);
    const bl=$("#blank"),fb=$("#fb"),k=wkey(q.sid,q.w);
    if(ok){
      if(!T.retry){T.score++;T.streak++;T.best=Math.max(T.best,T.streak);if((setId==="tricky"||setId[0]==="r")&&saved.wrong[k]){delete saved.wrong[k];T.cleared=(T.cleared||0)+1}}
      beep(true);bl.textContent=q.ans.form;bl.className="blank ok";inp.className="ok";
      const praise=["Great job!","Awesome!","Spot on!","You legend!","Brilliant!","Ripper!"][Math.floor(Math.random()*6)];
      fb.className="feedback ok";fb.textContent=praise+(v===q.w.toLowerCase()&&q.w.toLowerCase()!==q.ans.form.toLowerCase()?` 문장에서는 "${q.ans.form}" 이에요.`:"");
      const roo=$("#roo");roo.style.left=(8+((T.i+1)/n)*78)+"%";roo.classList.add("hop");
      speak(q.ex);finish();
    }else{
      T.streak=0;beep(false);inp.className="bad";const sn=$("#sent");sn.classList.remove("shake");void sn.offsetWidth;sn.classList.add("shake");
      if(!T.retry){T.retry=true;if(!T.miss.find(m=>m.w===q.w))T.miss.push(q);
        saved.wrong[k]={w:q.w,sid:q.sid,n:((saved.wrong[k]||{}).n||0)+1};persist();
        fb.className="feedback bad";fb.textContent="Not quite. Try once more! (다시 한 번)";inp.select()}
      else{bl.textContent=q.ans.form;bl.className="blank bad";fb.className="feedback bad";fb.textContent=`정답은 "${q.ans.form}" — 철자를 잘 보고 넘어가요.`;speak(q.ans.form);finish()}
    }
  };
  $("#check").onclick=check;
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
}
function renderResult(){
  const n=T.items.length,s=T.score,r=s/n;
  const stars=r===1?3:r>=.8?2:r>=.5?1:0;
  const isDay=!(setId in {mix:1,tricky:1})&&!T.noSave;
  if(!T.saved){
    if(isDay)saved.stars[setId]=Math.max(saved.stars[setId]||0,stars);
    const k=ymd(new Date());saved.days[k]=(saved.days[k]||0)+1;persist();T.saved=true;
    T.newPals=PALS.slice(palsOpen(T.starsBefore),palsOpen(totalStars()));
  }
  if(!T.fx&&(r>=.8||T.newPals.length)){confetti();T.fx=true}
  const msg=r===1?"Perfect score! You're a word champion!":r>=.8?"Brilliant work, Ian!":r>=.5?"Good effort! A bit more practice and you'll nail it.":"Let's learn the words once more, then try again.";
  const nx=nextSet();
  $("#pane").innerHTML=`
  <section class="result">
    <div style="width:88px;height:88px">${ROO}</div>
    <div class="big">${s} / ${n}</div>
    ${isDay?starRow(stars):""}
    <h3 style="font-size:24px">${msg}</h3>
    ${T.newPals.map(p=>`<div class="newpal"><div class="e">${p[0]}</div><div><div class="k">New friend in your zoo!</div><h3 style="font-size:22px">${esc(p[1])}</h3><p class="note">${esc(p[2])} ${esc(p[3])}</p></div></div>`).join("")}
    ${T.best>=3?`<p class="note">Best: ${T.best} in a row</p>`:""}
    ${(()=>{const o=palsOpen(totalStars()),at=PAL_AT[o];return at?`<p class="note">Next zoo friend in ${at-totalStars()} ★</p>`:""})()}
    ${T.cleared?`<p class="note">오답 노트에서 ${T.cleared}개를 지웠어요!</p>`:""}
    ${T.miss.length?`<p class="note">오답 노트에 넣은 단어</p><div class="miss">${T.miss.map(m=>`<span>${esc(m.w)}</span>`).join("")}</div>`:""}
    <div class="row" style="justify-content:center">
      ${T.miss.length?'<button class="btn sun" id="redo">Retry missed words</button>':""}
      ${isDay&&nx.id!==setId?`<button class="btn green" id="nextDay">Next: ${dayName(nx)}</button>`:""}
      <button class="btn" id="again">${isDay?"Test again":"New test"}</button>
      <button class="btn ghost" id="home">Home</button>
    </div>
  </section>`;
  T.newPals.forEach(p=>setTimeout(()=>speak("New friend! "+p[1]+"."),900));
  const redo=$("#redo");if(redo)redo.onclick=()=>{const m=T.miss.map(({ans,...x})=>x);T=newTest(m);T.noSave=true;renderTest()};
  const nd=$("#nextDay");if(nd)nd.onclick=()=>go("day",nx.id,nx.kind==="review"?"test":"study");
  $("#again").onclick=()=>{T=null;renderTest()};
  $("#home").onclick=()=>go("home");
}

booted=true;
