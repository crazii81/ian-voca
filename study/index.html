<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이안이 공부방</title>
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.tile{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:#C7CBD3}
.tile .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;flex:none}
.tile .t{font-size:18px;font-weight:700}
.tile .arrow{margin-left:auto;color:var(--mute);font-size:20px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><p class="muted">불러오는 중…</p></div></div>
<script type="module">
import { backend, CONFIG, localDate, addDays, weekStart, sessionXP, wordHopXP, wordHopStars, LEVEL_XP } from "./backend.js";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { user:null, err:"", math:null, wh:null };
const demoQ = backend.demo ? "?demo" : "";

function studyDays(){
  const set=new Set((S.math||[]).map(s=>s.date));
  ((S.wh&&S.wh.log)||[]).forEach(e=>{ if(e&&e.t) set.add(localDate(e.t)); });
  return set;
}
function streak(){
  const set=studyDays(); if(!set.size) return 0;
  let d=localDate(); if(!set.has(d)) d=addDays(d,-1);
  let n=0; while(set.has(d)){ n++; d=addDays(d,-1); } return n;
}
function render(){
  const app=$("#app");
  if(!S.user){
    app.innerHTML = `<div style="padding:48px 4px 0"><div class="label">STUDY ROOM</div><h2 style="font-size:30px;margin-top:4px">${esc(CONFIG.kidName)}이 공부방</h2>
    <p class="muted" style="margin:8px 0 22px">수학 탐험과 영어 Word Hop을 한곳에서.</p>
    <button class="pri big-btn" id="login">Google 계정으로 로그인</button>${S.err?`<div class="err">${esc(S.err)}</div>`:""}
    <p class="muted" style="margin-top:16px">허용된 가족 계정만 사용할 수 있어요.</p></div>`;
    $("#login").onclick = async () => { S.err=""; try{ S.user = await backend.login(); await loadMath(); }catch(e){ S.err="로그인하지 못했어요. 다시 시도해 주세요."; } render(); };
    return;
  }
  const hour = new Date().getHours();
  const hi = hour<12 ? "좋은 아침" : hour<18 ? "반가워" : "오늘도 수고했어";
  const m = S.math || [];
  const mx = m.reduce((a,x)=>a+sessionXP(x),0), ex = wordHopXP(S.wh), xp = mx+ex, lv = Math.floor(xp/LEVEL_XP)+1, cur = xp%LEVEL_XP;
  const td = localDate(), ws = weekStart(td), wd=["월","화","수","목","금","토","일"];
  const days = [...Array(7)].map((_,i)=>addDays(ws,i));
  const mDays = new Set(m.map(x=>x.date)), eDays = new Set(((S.wh&&S.wh.log)||[]).filter(e=>e&&e.t).map(e=>localDate(e.t)));
  app.innerHTML = `<div class="top"><div class="brand"><div class="logo" style="background:#24876a">★</div><div><div class="eyebrow">${new Date().toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"})}</div><div class="brandname">${esc(CONFIG.kidName)}이 공부방</div></div></div>
    <div class="pills"><span class="pillx fire">🔥 ${streak()}</span><span class="pillx lv">Lv.${lv}</span></div></div>
  ${backend.demo?`<div class="notice">데모 모드예요.</div>`:""}
  <div class="dadmsg"><div class="av" style="background:#1d6fc2">P</div><div style="flex:1"><div class="eyebrow">Paul 쌤</div>${hi}, ${esc(CONFIG.kidName)}! 수학이랑 영어 XP가 합쳐져서 같이 레벨이 올라가.</div></div>
  <div class="panel"><div class="row between"><h3>공부방 레벨 ${lv}</h3><span class="pillx">⭐ ${xp} XP</span></div>
    <div class="lvl big"><i style="width:${cur/LEVEL_XP*100}%"></i></div>
    <div class="row" style="gap:8px"><div class="stat"><b class="num">${mx}</b><span>📐 수학 XP</span></div><div class="stat"><b class="num">${ex}</b><span>🔤 영어 XP (⭐${wordHopStars(S.wh)})</span></div></div>
    <div class="muted">다음 레벨까지 ${LEVEL_XP-cur} XP · Word Hop 별 1개 = 20 XP</div></div>
  <div class="panel"><h3>이번 주</h3><div class="wdays" style="margin:0">${days.map((d,i)=>{ const a=mDays.has(d), e=eDays.has(d); return `<div class="wday ${a||e?"on":""} ${d===td?"today":""}"><span>${wd[i]}</span><b>${a?"📐":""}${e?"🔤":""}${!a&&!e?"·":""}</b></div>`; }).join("")}</div></div>
  <a class="tile" href="math.html${demoQ}"><div class="ic" style="background:#4F46E5">Σ</div><div><div class="t">수학 탐험</div><div class="muted">학습지 채점 · 풀이 과정 · 실수 분석</div></div><span class="arrow">›</span></a>
  <a class="tile" href="${esc(CONFIG.wordHopUrl)}"><div class="ic" style="background:#0E7490">Aa</div><div><div class="t">Word Hop</div><div class="muted">영어 단어 학습 · ⭐ ${wordHopStars(S.wh)}</div></div><span class="arrow">›</span></a>
  ${S.err?`<div class="notice">${esc(S.err)}</div>`:""}
  <div class="row between" style="margin-top:20px"><span class="muted">${esc(S.user.email||"")}</span><button class="mini" id="logout">로그아웃</button></div>`;
  $("#logout").onclick = async () => { await backend.logout(); S.user=null; S.math=null; render(); };
}
async function loadMath(){
  try { [S.math, S.wh] = await Promise.all([backend.listSessions(), backend.getWordHop().catch(()=>null)]); }
  catch(e){ S.math=null; S.err = (e && e.code==="permission-denied") ? "이 계정은 공부방 기록에 접근할 수 없어요." : ""; }
}
(async () => {
  try { S.user = await backend.currentUser(); } catch(_) {}
  if (S.user) await loadMath();
  render();
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
