<script type="module">
import { backend, CONFIG, localDate, addDays, weekStart, sessionXP, wordHopXP, wordHopStars, LEVEL_XP } from "./backend.js";
const KID = CONFIG.kidName, GRADE = CONFIG.grade;
const TAGS = ["받아올림 실수","받아내림 실수","구구단 실수","0 처리","자리 맞추기","몫 자리","나머지 실수","옮겨쓰기 실수","문제 잘못 읽음","식 미완성","연산 선택","단위 변환","빈칸/미완성","기타"];
const TEACHER = { name:"Paul 쌤", sym:"P", color:"#1d6fc2", bg:"#dcebfa" };
// 레벨이 오를 때마다 한 장씩 열리는 '수학 천재 카드' (Word Hop의 동물원처럼)
const GENIUSES = [
  { sym:"△", name:"피타고라스", era:"기원전 570?–495 · 그리스", color:"#24876a", fact:"직각삼각형의 세 변 사이의 규칙(피타고라스 정리)으로 유명해요. 세상 모든 것에 수의 비밀이 숨어 있다고 믿었어요." },
  { sym:"◯", name:"유클리드", era:"기원전 300년경 · 그리스", color:"#1d6fc2", fact:"『원론』이라는 책을 썼는데, 2000년 넘게 전 세계에서 기하학 교과서로 쓰였어요." },
  { sym:"π", name:"아르키메데스", era:"기원전 287–212 · 그리스", color:"#0e7490", fact:"목욕하다가 부력의 원리를 깨닫고 ‘유레카!’를 외쳤다는 이야기로 유명해요. 원주율 π도 계산했어요." },
  { sym:"x", name:"알콰리즈미", era:"780?–850? · 페르시아", color:"#b45309", fact:"‘알고리즘’이라는 말이 이 사람 이름에서 나왔어요. 대수학(algebra)이라는 이름도 그의 책 제목에서 왔어요." },
  { sym:"1·1·2", name:"피보나치", era:"1170?–1250? · 이탈리아", color:"#d9483d", fact:"1, 1, 2, 3, 5, 8… 앞의 두 수를 더해 가는 ‘피보나치 수열’로 유명해요. 유럽에 지금 우리가 쓰는 숫자를 널리 알렸어요." },
  { sym:"方", name:"최석정", era:"1646–1715 · 조선", color:"#9a3412", fact:"조선의 영의정이자 수학자예요. 『구수략』에서 가로·세로 합이 같은 마방진을 연구했어요." },
  { sym:"算", name:"홍정하", era:"1684–? · 조선", color:"#b91c1c", fact:"조선의 산학자예요. 『구일집』을 남겼고, 청나라 사신과의 수학 문답에서 실력을 보여줬어요." },
  { sym:"e", name:"오일러", era:"1707–1783 · 스위스", color:"#4f46e5", fact:"역사상 가장 많은 수학 논문을 쓴 사람 중 하나예요. 눈이 거의 안 보이게 된 뒤에도 머릿속으로 계산하며 연구를 계속했어요." },
  { sym:"Σ", name:"가우스", era:"1777–1855 · 독일", color:"#1d4ed8", fact:"초등학생 때 1부터 100까지 더하는 문제를 순식간에 풀었다고 알려진 ‘수학의 왕자’예요." },
  { sym:"{ }", name:"에이다 러브레이스", era:"1815–1852 · 영국", color:"#7c3aed", fact:"세계 최초의 컴퓨터 프로그램을 쓴 사람으로 꼽혀요. 계산을 ‘단계별 명령’으로 생각했어요." },
  { sym:"∞", name:"라마누잔", era:"1887–1920 · 인도", color:"#047857", fact:"거의 혼자 공부해서 놀라운 공식들을 찾아냈어요. 1729라는 숫자의 특별함을 바로 알아본 일화가 유명해요." },
  { sym:"∀", name:"에미 뇌터", era:"1882–1935 · 독일", color:"#be185d", fact:"현대 대수학을 만든 수학자예요. 아인슈타인도 그녀의 연구를 크게 칭찬했어요." }
];
const S = { user:null, signedIn:false, loginErr:"", canImg:true, ready:false, sessions:[], files:[], tab:"home", view:null, grading:false, openTag:null, delConfirm:null, err:"", settings:{}, newCard:null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => localDate();
const nums = s => (String(s ?? "").match(/\d+/g) || []).map(Number);
const sameNums = (a,b) => { const x=nums(a), y=nums(b); return x.length>0 && x.length===y.length && x.every((v,i)=>v===y[i]); };
const placeName = k => ["일","십","백","천","만"][k] || "";
const M = () => TEACHER;
const avatar = (m, sm) => `<div class="av${sm?" sm":""}" style="background:${m.color}">${m.sym}</div>`;
function applyTheme(){}

/* ---------- startup ---------- */
async function boot(){
  try { S.user = await backend.currentUser(); } catch(e){ S.loginErr = "로그인 정보를 확인하지 못했어요."; }
  S.signedIn = !!S.user;
  if (S.signedIn) await loadAll();
  S.ready = true; applyTheme(); render();
}
async function loadAll(){
  let done=false;
  const timer = setTimeout(()=>{ if(!done){ S.err="기록을 아직 불러오지 못했어요. 인터넷 연결을 확인해 주세요."; render(); } }, 10000);
  try {
    const [list, settings, wh] = await Promise.all([backend.listSessions(), backend.getSettings().catch(()=>({})), backend.getWordHop().catch(()=>null)]);
    S.wh = wh;
    S.sessions = list.filter(v=>Array.isArray(v.problems));
    S.settings = settings || {};
    S.err="";
  } catch(e){ S.err = (e && e.code==="permission-denied") ? "이 계정은 공부방 기록에 접근할 수 없어요. 허용된 계정으로 로그인해 주세요." : "기록을 불러오지 못했어요."; }
  done=true; clearTimeout(timer);
}
async function saveSession(s){
  try { await backend.saveSession(s); }
  catch(e){ S.err = "기록 저장에 실패했어요. 인터넷 연결을 확인해 주세요."; render(); }
}
let saving = Promise.resolve();
function queueSave(s){ saving = saving.then(()=>saveSession(s)); }
async function saveSettings(obj){
  Object.assign(S.settings, obj);
  saving = saving.then(()=>backend.setSettings(obj).then(()=>toast("저장했어요")).catch(()=>{ S.err="설정 저장에 실패했어요."; render(); }));
}
function celebrate(levelBefore){
  const after = level().lv;
  if(after > levelBefore){
    const card = GENIUSES[Math.min(after, GENIUSES.length)-1];
    if(after <= GENIUSES.length){ S.newCard = card; }
    confetti(40); toast(`레벨 업! Lv.${after}`);
  }
}

/* ---------- stats (XP) ---------- */
function xpOf(s){ return sessionXP(s); }
function mathXP(){ return S.sessions.reduce((a,s)=>a+xpOf(s),0); }
function totalXP(){ return mathXP() + wordHopXP(S.wh); }        // 수학 + 영어(Word Hop) 합산
const LV = LEVEL_XP;
function level(){ const x=totalXP(); return { lv:Math.floor(x/LV)+1, cur:x%LV, xp:x }; }
function studyDays(){                                            // 수학이나 영어를 한 날
  const set = new Set(S.sessions.map(s=>s.date));
  if(S.wh) (S.wh.log||[]).forEach(e=>{ if(e && e.t) set.add(localDate(e.t)); });
  return set;
}
function streak(){
  const set = studyDays(); if(!set.size) return 0;
  let d = today(); if(!set.has(d)) d = addDays(d,-1);
  let n=0; while(set.has(d)){ n++; d=addDays(d,-1); } return n;
}
function recount(s){ s.total = s.problems.length; s.correct = s.problems.filter(p=>p.status==="correct").length; }
function tagStats(){
  const now = Date.now(), m = {};
  for(const s of S.sessions) for(const p of s.problems){
    if(p.status!=="wrong" && p.status!=="incomplete") continue;
    for(const t of (p.tags&&p.tags.length?p.tags:["기타"])){
      const o = m[t] || (m[t]={tag:t,total:0,recent:0,practiced:0,items:[]});
      o.total++; if(now - s.ts < 14*864e5) o.recent++;
      o.practiced += (p.practiceDone||0); o.items.push({s,p});
    }
  }
  return Object.values(m).sort((a,b)=>b.recent-a.recent || b.total-a.total);
}
function pendingPractice(){
  const out=[];
  for(const s of S.sessions) for(const p of s.problems){
    if(p.status!=="wrong" && p.status!=="incomplete") continue;
    (p.practice||[]).forEach((q,i)=>{ if(!(p.practiceSolved||[]).includes(i)) out.push({s,p,i,q}); });
  }
  const w = {}; tagStats().forEach(t=>w[t.tag]=t.recent*10+t.total);
  const score = x => Math.max(0, ...(x.p.tags||[]).map(t=>w[t]||0));
  return out.map((x,o)=>({x,o})).sort((a,b)=>score(b.x)-score(a.x) || a.o-b.o).map(y=>y.x).slice(0,3);
}

/* ---------- image helpers ---------- */
async function loadBitmap(file){
  try { return await createImageBitmap(file, { imageOrientation:"from-image" }); }
  catch(e){ return await new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); }); }
}
function toCanvas(bmp, maxSide, crop){
  const sw = crop ? crop.w : bmp.width, sh = crop ? crop.h : bmp.height;
  const k = Math.min(1, maxSide / Math.max(sw, sh));
  const c = document.createElement("canvas"); c.width = Math.round(sw*k); c.height = Math.round(sh*k);
  c.getContext("2d").drawImage(bmp, crop?crop.x:0, crop?crop.y:0, sw, sh, 0, 0, c.width, c.height);
  return c;
}
const canvasBlob = (c,q) => new Promise(r=>c.toBlob(r,"image/jpeg",q));
function cropBox(bmp, box){
  if(!Array.isArray(box) || box.length!==4 || box.some(v=>typeof v!=="number" || !isFinite(v))) return null;
  let [x,y,w,h] = box; if(w<=0||h<=0||x>1||y>1) return null;
  const px = w*0.18, py = h*0.25;
  x=Math.max(0,x-px); y=Math.max(0,y-py); w=Math.min(1-x,w+2*px); h=Math.min(1-y,h+2*py);
  return toCanvas(bmp, 560, { x:x*bmp.width, y:y*bmp.height, w:w*bmp.width, h:h*bmp.height }).toDataURL("image/jpeg",0.7);
}

/* ---------- grading ---------- */
function fixProblem(p){
  p.tags = (Array.isArray(p.tags)?p.tags:[]).filter(t=>TAGS.includes(t));
  p.practice = (Array.isArray(p.practice)?p.practice:[]).filter(x=>x && x.q && x.a).slice(0,2);
  p.practiceDone = 0; p.practiceSolved = [];
  if(!["correct","wrong","incomplete","unclear"].includes(p.status)) p.status="unclear";
  const v = p.visual || {};
  if(v.student_work && typeof v.student_work==="object"){
    const sw=v.student_work, dg=x=>String(x??"").replace(/[^0-9]/g,"");
    v.student_work = v.kind==="multiply" ? { result: dg(sw.result) }
      : { quotient: dg(sw.quotient), rows: (Array.isArray(sw.rows)?sw.rows:[]).map(dg).filter(Boolean).slice(0,12) };
  }
  let computed = null;
  if(v.kind==="long_division" && Number.isInteger(+v.dividend) && Number.isInteger(+v.divisor) && +v.divisor>0 && +v.dividend>0 && String(+v.dividend).length<=4){
    const q=Math.floor(v.dividend/v.divisor), r=v.dividend%v.divisor; computed = r ? `${q} … ${r}` : `${q}`;
  } else if(v.kind==="multiply" && Number.isInteger(+v.a) && Number.isInteger(+v.b) && +v.b>=0 && +v.b<=9 && String(+v.a).length<=4){
    computed = String(v.a*v.b);
  } else if(v.kind!=="steps") p.visual = {kind:"none"};
  if(computed && (p.type==="division"||p.type==="multiplication")){
    p.answer = computed;
    if(p.status!=="unclear" && nums(p.student).length){
      if(sameNums(p.student, computed)) { p.status="correct"; p.tags=[]; p.practice=[]; }
      else if(p.status==="correct") p.status="wrong";
    }
  }
  return p;
}
async function grade(){
  if(!S.files.length || S.grading) return;
  S.grading = true; S.err=""; S.progress = {i:0,n:S.files.length}; render();
  const batch=[], lv0=level().lv;
  for(let i=0;i<S.files.length;i++){
    S.progress.i=i; render();
    try{
      const bmp = await loadBitmap(S.files[i]);
      const send = await canvasBlob(toCanvas(bmp,1600),0.85);
      const res = await backend.grade(send, "paul");
      if(!res || !Array.isArray(res.problems) || !res.problems.length) throw {code:"empty"};
      const problems = res.problems.map(fixProblem);
      for(const p of problems){ if(p.status!=="correct") p.crop = cropBox(bmp, p.box); }
      const s = { id:"s"+Date.now()+Math.random().toString(36).slice(2,6), ts:Date.now(), date:today(),
        sheet:String(res.sheet||"수학 학습지").slice(0,60), praise:String(res.overall_praise||""), tip:String(res.habit_tip||""),
        thumb: toCanvas(bmp,900).toDataURL("image/jpeg",0.6), problems };
      recount(s); S.sessions.unshift(s); batch.push(s); queueSave(s);
    }catch(e){
      const c = e && e.code;
      S.err = c==="daily_limit" ? (e.message || "오늘 채점 한도를 다 썼어요. 내일 다시 해요.")
        : c==="not_allowed" || c==="unauthorized" ? "이 계정은 채점을 사용할 수 없어요. 허용된 계정으로 로그인해 주세요."
        : c==="network" ? "채점 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요."
        : c==="busy" ? "무료 채점 사용량이 잠깐 꽉 찼어요. 몇 분 뒤에 다시 해 주세요."
        : c==="bad_image" ? "사진을 읽을 수 없어요. 다른 사진으로 해볼까요?"
        : c==="empty" ? "사진에서 문제를 찾지 못했어요. 학습지 전체가 잘 보이게 다시 찍어주세요."
        : `채점 중에 문제가 생겼어요. 다시 시도해 주세요. (${c || "unknown"}${e && e.status ? " " + e.status : ""})`;
      if(["daily_limit","not_allowed","unauthorized","network","busy"].includes(c)) break;
    }
  }
  S.grading=false; S.files=[];
  if(batch.length){
    S.view = {type:"result", ids:batch.map(b=>b.id)};
    toast(`+${batch.reduce((a,s)=>a+xpOf(s),0)} XP`);
    if(batch.some(b=>b.total>0 && b.correct===b.total)) confetti(60); else confetti(18);
    celebrate(lv0);
  }
  render(); window.scrollTo(0,0);
}

/* ---------- visual frames ---------- */
const INK="#111827", HOT=()=>M().color, HOTBG=()=>M().bg, GOOD="#15803D", GOODBG="#E8F6EC", FAINT="#9CA3AF";
const NUMSTYLE = "font-family:'IBM Plex Sans KR',sans-serif;font-weight:600;font-size:28px";
const bugBox = msg => `<div class="bug">${msg}</div>`;
function ianOf(p){
  const v=p.visual||{}, sw=v.student_work||{}, n=nums(p.student);
  if(p.status==="unclear") return null;
  if(v.kind==="long_division"){
    const q = sw.quotient || (n.length ? String(n[0]) : "");
    if(!q && !(sw.rows||[]).length) return null;
    const hasR = /…|나머지|\.\.\./.test(String(p.student||""));
    return { q, rows: sw.rows||[], r: hasR && n.length>1 ? n[1] : (q ? 0 : null) };
  }
  if(v.kind==="multiply"){
    const res = sw.result || (n.length ? String(n[0]) : "");
    return res ? { res } : null;
  }
  return null;
}
function divFrames(dividend, divisor, ian){
  const D=String(dividend).split("").map(Number), n=D.length, steps=[];
  let cur=0, started=false;
  for(let i=0;i<n;i++){ cur=cur*10+D[i]; const q=Math.floor(cur/divisor); if(!started && q===0 && i<n-1) continue; started=true; steps.push({i,cur,q,prod:q*divisor,rem:cur-q*divisor}); cur-=q*divisor; }
  const Q=Math.floor(dividend/divisor), R=dividend%divisor;
  let r=2; steps.forEach(s=>{ s.prodRow=r; s.nextRow=r+1; r+=2; });
  const X0=96, CW=36, W=Math.max(300, X0+n*CW+40), H=58+r*44;
  const cx=c=>X0+c*CW+CW/2, ry=k=>48+k*44, el=[];
  const crow=[];
  steps.forEach((s,k)=>{
    el.push({f:2*k,row:0,end:s.i,str:String(s.q)});
    el.push({f:2*k+1,row:s.prodRow,end:s.i,str:String(s.prod)});
    el.push({f:2*k+1,line:true,row:s.prodRow,from:s.i-String(s.cur).length+1,to:s.i});
    crow.push({str:String(s.prod),end:s.i});
    const nx=steps[k+1];
    if(nx){ el.push({f:2*k+1,row:s.nextRow,end:nx.i,str:String(nx.cur),down:nx.i}); crow.push({str:String(nx.cur),end:nx.i}); }
    else { el.push({f:2*k+1,row:s.nextRow,end:s.i,str:String(s.rem)}); crow.push({str:String(s.rem),end:s.i}); }
  });
  /* ---- compare with the kid's own work ---- */
  const bugs=[];
  if(ian){
    const q=ian.q||"";
    const at=c=>{ const idx=q.length-1-(n-1-c); return idx>=0 && idx<q.length ? q[idx] : null; };
    if(q) steps.forEach((s,k)=>{ const d=at(s.i); if(d===null || +d!==s.q)
      bugs.push({f:2*k, mark:{row:0,from:s.i,to:s.i}, msg:`몫의 ${placeName(n-1-s.i)}의 자리 · 내가 쓴 숫자 <b>${d===null?"(빈칸)":d}</b> → 바른 숫자 <b>${s.q}</b>`}); });
    (ian.rows||[]).forEach((v,j)=>{ const c=crow[j]; if(!c || +v===+c.str) return;
      const s=steps[Math.floor(j/2)], end=c.end;

function weekData(start){
  const end=addDays(start,6), inW=d=>d>=start && d<=end;
  const ss=S.sessions.filter(s=>inW(s.date));
  const total=ss.reduce((a,s)=>a+s.total,0), correct=ss.reduce((a,s)=>a+s.correct,0);
  const tags={};
  ss.forEach(s=>s.problems.forEach(p=>{ if(p.status!=="wrong"&&p.status!=="incomplete") return; (p.tags&&p.tags.length?p.tags:["기타"]).forEach(t=>tags[t]=(tags[t]||0)+1); }));
  let missions=0; S.sessions.forEach(s=>s.problems.forEach(p=>missions+=(p.practiceLog||[]).filter(inW).length));
  const bugs=ss.reduce((a,s)=>a+s.problems.filter(p=>p.bugFound).length,0);
  const mathDays=new Set(ss.map(s=>s.date));
  const elog=S.wh ? (S.wh.log||[]).filter(e=>e&&e.t&&inW(localDate(e.t))) : [];
  const engDays=new Set(elog.map(e=>localDate(e.t)));
  const eN=elog.reduce((a,e)=>a+(+e.n||0),0), eS=elog.reduce((a,e)=>a+(+e.score||0),0);
  const best=ss.filter(s=>s.total>=5).sort((a,b)=>b.correct/b.total-a.correct/a.total)[0]||null;
  const xp=ss.reduce((a,s)=>a+s.correct*10+(s.total>0&&s.correct===s.total?30:0)+s.problems.filter(p=>p.bugFound).length*5,0)+missions*15;

}

    sum = W.ss.length ? `이번 주 수학 학습지 ${W.ss.length}장, 정답률 ${W.acc}%` + (diff!=null ? (diff>=0 ? ` (지난주보다 +${diff}%p 올랐어!)` : ` (지난주보다 ${diff}%p)`) : "") + ". " : "이번 주는 수학 학습지가 없었어. ";
    if(W.elog.length) sum += `영어는 Word Hop을 ${W.engDays.size}일 했어. `;
    if(improved.length) sum += `지난주에 있던 ‘${improved.slice(0,2).join("’, ‘")}’ 실수가 이번 주엔 하나도 없어. 대단해! `;
    if(W.bugs) sum += `실수를 스스로 ${W.bugs}번이나 찾아냈어. `;
    sum += top.length ? `다음 주 목표는 ‘${top[0][0]}’ 잡기!` : (W.ss.length ? "틀린 문제가 거의 없는 한 주였어!" : "");
  }
  S.reportText = `[${KID} 주간 리포트 ${fmt(W.start)}~${fmt(W.end)}]\n`
    + `· 공부한 날: ${days.filter(d=>W.mathDays.has(d)||W.engDays.has(d)).length}일 (수학 ${W.mathDays.size}일, 영어 ${W.engDays.size}일)\n`
    + `· 수학: 학습지 ${W.ss.length}장, 문제 ${W.total}개, 정답률 ${W.acc??"-"}%${diff!=null?` (지난주 대비 ${diff>=0?"+":""}${diff}%p)`:""}\n`
    + `· 미션 ${W.missions}개 해결, 스스로 찾은 실수 ${W.bugs}개\n`
    + (top.length?`· 자주 한 실수: ${top.map(([t,n])=>`${t} ${n}번`).join(", ")}\n`:"")
    + (improved.length?`· 좋아진 점: ${improved.join(", ")} 실수 0번\n`:"")
    + (W.elog.length?`· 영어(Word Hop): ${W.elog.length}회 학습${W.eAcc!=null?`, 정답률 ${W.eAcc}%`:""}\n`:"")
    + `· Paul 쌤 한마디: ${sum}`;
  let h=`<div class="card report"><div class="row between"><h3>📅 주간 리포트</h3><div class="row" style="gap:4px"><button class="mini" data-act="wk" data-d="1">◀</button><span class="num" style="font-weight:800;min-width:92px;text-align:center">${fmt(W.start)}~${fmt(W.end)}</span><button class="mini" data-act="wk" data-d="-1" ${off===0?"disabled":""}>▶</button></div></div>
  <div class="wdays">${days.map((d,i)=>{ const m=W.mathDays.has(d), e=W.engDays.has(d); return `<div class="wday ${m||e?"on":""} ${d===today()?"today":""}"><span>${wd[i]}</span><b>${m?"📐":""}${e?"🔤":""}${!m&&!e?"·":""}</b></div>`; }).join("")}</div>
  <div class="rgrid">
    <div class="stat"><b class="num">${W.ss.length}</b><span>📐 학습지</span></div>
    <div class="stat"><b class="num">${W.acc??"–"}${W.acc!=null?"%":""}</b><span>정답률 ${diff==null?"":`<em class="${diff>=0?"up":"down"}">${diff>=0?"▲":"▼"}${Math.abs(diff)}</em>`}</span></div>
    <div class="stat"><b class="num">${W.missions}</b><span>🎯 미션</span></div>
    <div class="stat"><b class="num">${W.bugs}</b><span>🔍 실수 찾기</span></div>
    <div class="stat"><b class="num">${W.elog.length}</b><span>🔤 영어 학습${W.eAcc!=null?` · ${W.eAcc}%`:""}</span></div>
    <div class="stat"><b class="num">+${W.xp}</b><span>수학 XP</span></div>
  </div>`;
  if(top.length) h+=`<div class="rsec"><div class="eyebrow">자주 한 실수</div>${top.map(([t,n])=>{ const pv=P.tags[t]||0, d=n-pv; return `<div class="row between rline"><span>${esc(t)}</span><span class="num">${n}번 ${pv?`<em class="${d<=0?"up":"down"}">${d>0?"▲":d<0?"▼":"–"}${d?Math.abs(d):""}</em>`:`<em class="down">new</em>`}</span></div>`; }).join("")}</div>`;
  if(improved.length) h+=`<div class="rsec"><div class="eyebrow">좋아진 점</div><div>${improved.map(t=>`<span class="pill ok" style="margin:2px">${esc(t)} 0번 ✓</span>`).join("")}</div></div>`;
  if(W.best) h+=`<div class="rsec"><div class="eyebrow">이번 주 베스트</div><div>${esc(W.best.date)} · ${esc(W.best.sheet)} <b class="num">${W.best.correct}/${W.best.total}</b></div></div>`;
  h+=`<div class="dadmsg" style="margin:12px 0 0"><div class="av sm" style="background:${TEACHER.color}">P</div><div style="flex:1"><div class="eyebrow">Paul 쌤 한마디</div>${esc(sum)}</div></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="mini" data-act="copyrep">📋 카톡용 텍스트 복사</button></div><div id="repcopy"></div></div>`;
  return h;
}
function weakView(){
  const ts=tagStats();
  const wk = d => S.sessions.filter(s=>Date.now()-s.ts >= d*7*864e5 && Date.now()-s.ts < (d+1)*7*864e5);
  const acc = arr => { const t=arr.reduce((a,s)=>a+s.total,0), c=arr.reduce((a,s)=>a+s.correct,0); return t? Math.round(c/t*100) : null; };
  const a0=acc(wk(0)), a1=acc(wk(1));
  const diff = (a0!=null && a1!=null) ? a0-a1 : null;
  let h=`<div style="padding:4px 2px"><div class="label">부모용</div><h2 style="font-size:24px">학습 분석</h2></div>${reportView()}
  `;
  h+=`<div class="card"><h3>실수 유형</h3><p class="muted" style="margin:4px 0 6px">2주 안에 같은 유형이 3번 이상이면 ‘반복’으로 표시해요. 항목을 누르면 실제 문제가 보여요.</p>`;
  if(!ts.length) h+=`<p class="muted">아직 틀린 문제 기록이 없어요.</p>`;
  const max = Math.max(1,...ts.map(t=>t.total));
  ts.forEach(t=>{
    const st = t.recent>=3 ? `<span class="pill warn">반복</span>` : (t.practiced>=Math.max(2,t.recent) ? `<span class="pill ok">극복 중</span>` : "");
    h+=`<div class="tagrow" data-act="tag" data-t="${esc(t.tag)}"><div class="row between"><b>${esc(t.tag)}</b>${st}</div>
    <div class="row" style="margin-top:6px"><div class="bar"><i style="width:${t.total/max*100}%"></i></div><span class="muted num" style="min-width:150px;text-align:right">전체 ${t.total} · 최근 ${t.recent} · 연습 ${t.practiced}</span></div>`;
    if(S.openTag===t.tag){ h+=`<div style="margin-top:8px">`; t.items.slice(0,6).forEach(({s,p})=>{ h+=`<div class="muted" style="padding:3px 0">${esc(s.date)} · ${esc(p.no)} ${esc(p.question)} → <b style="color:var(--bad)">${esc(p.student||"빈칸")}</b> / 정답 <b style="color:var(--ok)">${esc(p.answer)}</b>${p.where?` — ${esc(p.where)}`:""}</div>`; }); h+=`</div>`; }
    h+=`</div>`;
  });
  h+=`</div>`;
  const focus = ts.filter(t=>t.recent>=1).slice(0,2);
  if(focus.length){
    const found = S.sessions.reduce((a,s)=>a+s.problems.filter(p=>p.bugFound).length,0), shown = S.sessions.reduce((a,s)=>a+s.problems.filter(p=>p.bugDone).length,0);
    h+=`<div class="card"><h3>이번 주 다음 행동</h3><p class="muted" style="margin:4px 0 8px">최근 2주에 가장 많이 나온 실수부터 잡아요.</p>`;
    focus.forEach(t=>{ const A=ACTIONS[t.tag]||ACTIONS["기타"];
      h+=`<div class="plan"><div class="row between"><b>${esc(t.tag)}</b><span class="pill ${t.recent>=3?"warn":""}">최근 ${t.recent}번</span></div>
      <div class="pl"><span>${esc(KID)}이 습관</span>${esc(A.habit)}</div>
      <div class="pl"><span>연습</span>${esc(A.drill)} · 홈의 ‘오늘의 미션’에 먼저 나와요</div>
      <div class="pl"><span>부모님</span>${esc(A.parent)}</div></div>`; });
    h+=`<div class="pl" style="margin-top:6px"><span>스스로 찾기</span>틀린 문제 ${shown}개 중 ${found}개는 ${esc(KID)}이가 직접 실수를 찾아냈어요.</div>`;
    h+=`<p class="muted" style="margin:10px 0 0">대화 팁: "요즘 <b>${esc(focus[0].tag)}</b>에서 자꾸 걸리던데, 오늘 미션 3개만 같이 끝내볼까?" 실수를 지적하기보다 스스로 찾아낸 순간을 칭찬해 주세요.</p></div>`;
  }
  const st0=S.settings;
  h+=`<div class="card"><h3>Paul 쌤 설정</h3><p class="muted" style="margin:4px 0 10px">홈 화면에 보이는 메시지와 보상 목표를 정해요.</p>
    <label class="flabel">${esc(KID)}에게 보낼 메시지</label><textarea id="set-msg" rows="2" placeholder="예: 이번 주 받아올림 미션 다 하면 주말에 보드게임 하자!">${esc(st0.dadMsg||"")}</textarea>
    <label class="flabel">보상 목표</label><div class="row" style="flex-wrap:wrap"><input type="text" id="set-rtext" style="flex:1;min-width:160px" placeholder="예: 게임 30분" value="${esc(st0.rewardText||"")}"><input type="text" id="set-rxp" inputmode="numeric" style="width:100px" placeholder="XP" value="${esc(st0.rewardXp||"")}"><span class="muted">XP 모으면</span></div>
    <div class="err" id="set-err"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="pri" data-act="saveset">저장</button></div></div>`;
  return h;
}
function meView(){
  const L=level(), ss=S.sessions, ts=tagStats(), st=streak();
  const perfect = ss.filter(s=>s.total>0&&s.correct===s.total).length;
  const solved = ss.reduce((a,s)=>a+s.problems.reduce((b,p)=>b+(p.practiceDone||0),0),0);
  const found = ss.reduce((a,s)=>a+s.problems.filter(p=>p.bugFound).length,0);
  const pr = t => ts.find(x=>x.tag===t)?.practiced||0;
  const B=[["🐣","첫 채점",ss.length>=1],["💯","첫 만점",perfect>=1],["🏆","만점 5회",perfect>=5],["🔥","3일 연속",st>=3],["🌈","7일 연속",st>=7],["📚","학습지 20장",ss.length>=20],
    ["🔍","실수 탐정 5회",found>=5],["💪","재도전 10문제",solved>=10],["🚀","재도전 30문제",solved>=30],["➕","받아올림 정복",pr("받아올림 실수")>=3],["0️⃣","0의 비밀",pr("0 처리")>=3],["🍬","나머지 정복",pr("나머지 실수")>=3]];
  let h=topBar();
  h+=`<div class="panel"><div class="row between"><h3>Lv.${L.lv}</h3><span class="muted num">다음 카드까지 ${LV-L.cur} XP</span></div><div class="lvl big"><i style="width:${L.cur/LV*100}%"></i></div><div class="row" style="gap:8px"><div class="stat"><b class="num">${mathXP()}</b><span>📐 수학 XP</span></div><div class="stat"><b class="num">${wordHopXP(S.wh)}</b><span>🔤 영어 XP (⭐${wordHopStars(S.wh)} × 20)</span></div></div>
  <p class="muted" style="margin:0">수학: 정답 10 · 만점 보너스 30 · 실수 찾기 5 · 재도전 15 XP / 영어: Word Hop 별 1개 = 20 XP${S.wh?"":" · Word Hop 기록을 아직 못 찾았어요"}</p></div>`;
  h+=`<h3 style="margin:18px 2px 8px">수학 천재 도감 <span class="muted">${Math.min(L.lv,GENIUSES.length)} / ${GENIUSES.length}</span></h3><div class="gzoo">`;
  GENIUSES.forEach((g,i)=>{ const open = i < L.lv;
    h+= open ? `<div class="gcard"><div class="gsym" style="background:${g.color}">${g.sym}</div><div class="bigname">${g.name}</div><div class="muted" style="font-size:12px">${g.era}</div><div class="gfact">${g.fact}</div></div>`
             : `<div class="gcard locked"><div class="gsym lk">🔒</div><div class="bigname">???</div><div class="muted" style="font-size:12px">Lv.${i+1}에 열려요</div></div>`; });
  h+=`</div><h3 style="margin:18px 2px 8px">업적</h3><div class="grid3">`;
  B.forEach(([e,n,ok])=>h+=`<div class="badge ${ok?"":"off"}"><span class="e">${e}</span>${n}</div>`);
  h+=`</div><div class="panel" style="margin-top:14px"><div class="row between"><div><div class="eyebrow">로그인 계정</div><div style="font-weight:600">${esc(S.user&&(S.user.email||S.user.displayName)||"")}</div></div><button class="mini" data-act="logout">로그아웃</button></div></div>`;
  return h;
}

/* ---------- effects ---------- */
function confetti(n=30){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box=document.createElement("div"); box.className="fx";
  const bits=["⭐","✨","🎉","🟡","🔵","🟢","🔴"];
  for(let i=0;i<n;i++){ const sp=document.createElement("span"); sp.textContent=bits[i%bits.length]; sp.style.left=Math.random()*100+"%"; sp.style.animationDelay=(Math.random()*0.4)+"s"; sp.style.fontSize=(16+Math.random()*16)+"px"; box.appendChild(sp); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),2200);
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2300); }
/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; S.tab=b.dataset.tab; S.view=null; S.delConfirm=null; if(S.tab==="me") S.newCard=null; render(); window.scrollTo(0,0); });
$("#file").addEventListener("change", e=>{ S.files=[...e.target.files].slice(0,6); e.target.value=""; render(); });
document.getElementById("app").addEventListener("click", async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, sid=t.dataset.s, find=id=>S.sessions.find(s=>s.id===id);
  if(a==="login"){ S.loginErr=""; try{ S.user=await backend.login(); S.signedIn=!!S.user; if(S.signedIn){ S.ready=false; render(); await loadAll(); S.ready=true; } }catch(err){ S.loginErr="로그인하지 못했어요. 다시 시도해 주세요."; } render(); }
  else if(a==="logout"){ await backend.logout(); S.user=null; S.signedIn=false; S.sessions=[]; render(); }
  else if(a==="tab"){ S.tab=t.dataset.t; S.view=null; if(S.tab==="me") S.newCard=null; render(); window.scrollTo(0,0); }
  else if(a==="wk"){ S.weekOff=Math.max(0,(S.weekOff||0)+(+t.dataset.d)); render(); }
  else if(a==="copyrep"){
    const box=$("#repcopy");
    try { await navigator.clipboard.writeText(S.reportText); toast("복사했어요. 카톡에 붙여넣기 하세요"); }
    catch(_){ box.innerHTML=`<textarea rows="8" readonly style="margin-top:8px">${esc(S.reportText)}</textarea><div class="muted">자동 복사가 안 돼서 아래 글을 길게 눌러 복사해 주세요.</div>`; }
  }
  else if(a==="saveset"){
    const msg=($("#set-msg").value||"").trim().slice(0,200), rt=($("#set-rtext").value||"").trim().slice(0,40), rx=($("#set-rxp").value||"").trim();
    if(rt && !/^\d+$/.test(rx)){ $("#set-err").textContent="보상 목표 XP를 숫자로 입력해 주세요."; return; }
    const obj={ dadMsg:msg, rewardText:rt, rewardXp: rt ? +rx : 0 };
    if(rt && (rt!==S.settings.rewardText || +rx!==+S.settings.rewardXp)) obj.rewardFrom = level().xp;  // 지금부터 모으는 XP
    saveSettings(obj); render();
  }
  else if(a==="file") $("#file").click();
  else if(a==="clear"){ S.files=[]; render(); }
  else if(a==="grade") grade();
  else if(a==="close"){ S.view=null; render(); }
  else if(a==="open"){ if(e.target.closest("button")) return; S.view={type:"result",ids:[t.dataset.id]}; render(); window.scrollTo(0,0); }
  else if(a==="jump"){ const el=document.getElementById("p-"+t.dataset.id); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); }
  else if(a==="stnext"||a==="stprev"){ const k=t.dataset.k, st=STEPPERS[k]; st.i = a==="stnext" ? (st.i+1)%st.frames.length : Math.max(0,st.i-1); document.getElementById("st-"+k).innerHTML=stepperInner(k); }
  else if(a==="bugtap"){
    const k=t.dataset.k, st=BUGS[k], md=MODELS[k], bi=+t.dataset.b; if(!st||!md) return;
    const s=find(sid), p=s.problems[+t.dataset.i];
    const marked = md.bugs.map((b,x)=>b.mark?x:-1).filter(x=>x>=0);
    if(bi>=0 && md.bugs[bi].mark){
      st.found.add(bi);
      if(marked.every(x=>st.found.has(x))){ const lv0=level().lv; p.bugFound=true; p.bugDone=true; queueSave(s); toast("실수 탐정 성공! +5 XP"); confetti(14); celebrate(lv0); st.msg=""; }
      else { st.msg=`찾았어! 아직 ${marked.length-[...st.found].filter(x=>marked.includes(x)).length}군데 더 있어.`; st.msgOk=true; }
    } else { st.msg="그 숫자는 맞게 썼어. 다른 곳을 찾아봐!"; st.msgOk=false; }
    render();
  }
  else if(a==="bugreveal"){ const k=t.dataset.k, s=find(sid), p=s.problems[+t.dataset.i]; if(BUGS[k]) BUGS[k].revealed=true; p.bugDone=true; queueSave(s); render(); }
  else if(a==="tag"){ S.openTag = S.openTag===t.dataset.t ? null : t.dataset.t; render(); }
  else if(a==="del"){ S.delConfirm=t.dataset.id; render(); }
  else if(a==="delno"){ S.delConfirm=null; render(); }
  else if(a==="delyes"){ const id=t.dataset.id; S.sessions=S.sessions.filter(s=>s.id!==id); S.delConfirm=null; render(); try{ await backend.deleteSession(id); }catch(_){ S.err="삭제에 실패했어요."; render(); } }
  else if(a==="flip"){ const s=find(sid), p=s.problems[+t.dataset.i];
    if(p.status==="correct") p.status="wrong"; else { p.status="correct"; p.tags=[]; }
    p.override=true; recount(s); queueSave(s); render(); }
  else if(a==="unclear"){ const s=find(sid), i=+t.dataset.i, p=s.problems[i], key=`${s.id}-${i}`, v=($("#un-"+key)||{}).value||"";
    if(!v.trim()){ $("#unerr-"+key).textContent="답을 먼저 입력해 줘."; return; }
    p.student=v.trim(); p.status = sameNums(p.student,p.answer) ? "correct" : "wrong";
    if(p.status==="correct"){ p.tags=[]; toast("+10 XP"); }
    recount(s); queueSave(s); render(); }
  else if(a==="prac"){ const s=find(sid), p=s.problems[+t.dataset.i], j=+t.dataset.j, key=`${s.id}-${t.dataset.i}-${j}`;
    const inp=$("#pr-"+key), fb=$("#fb-"+key), v=(inp&&inp.value||"").trim();
    if(!v){ fb.className="fb no"; fb.textContent="답을 먼저 입력해 줘."; return; }
    if(sameNums(v, p.practice[j].a)){ const lv0=level().lv; p.practiceSolved=[...(p.practiceSolved||[]), j]; p.practiceDone=(p.practiceDone||0)+1; p.practiceLog=[...(p.practiceLog||[]), today()]; toast("정답! +15 XP"); confetti(14); celebrate(lv0); queueSave(s); render(); }
    else { fb.className="fb no"; fb.textContent="아깝다. 풀이 과정을 한 번 더 보고 다시!"; }
  }
});
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
document.getElementById("app").addEventListener("input", e=>{ const id=e.target.id||""; if(id.startsWith("pr-")){ const fb=$("#fb-"+id.slice(3)); if(fb) fb.textContent=""; } if(id.startsWith("un-")){ const er=$("#unerr-"+id.slice(3)); if(er) er.textContent=""; } });
render();
boot();
</script>
