<script type="module">
import { backend, CONFIG } from "./backend.js";
const KID = CONFIG.kidName, GRADE = CONFIG.grade;
const TAGS = ["받아올림 실수","받아내림 실수","구구단 실수","0 처리","자리 맞추기","몫 자리","나머지 실수","옮겨쓰기 실수","문제 잘못 읽음","식 미완성","연산 선택","단위 변환","빈칸/미완성","기타"];
const MENTORS = [
  { id:"gauss", name:"가우스", era:"1777–1855 · 독일", sym:"Σ", color:"#4F46E5", bg:"#EEF0FF", voice:"glassy",
    fact:"초등학생 때 1부터 100까지 더하라는 문제를 순식간에 풀었다고 알려진 ‘수학의 왕자’.",
    hello:"계산이 빨라지는 비결은 규칙을 찾는 거야. 오늘 학습지도 같이 보자.",
    style:"독일의 수학자 가우스. 침착하고 날카롭다. 규칙과 지름길을 찾는 걸 좋아하고, 실수를 '규칙을 놓친 순간'으로 설명한다." },
  { id:"archimedes", name:"아르키메데스", era:"기원전 287–212 · 그리스", sym:"π", color:"#0E7490", bg:"#E6F6F9", voice:"rounded",
    fact:"목욕하다 부력의 원리를 깨닫고 ‘유레카!’를 외쳤다는 이야기로 유명한 발명가이자 수학자.",
    hello:"발견은 직접 해봐야 머리에 남아. 틀린 문제는 새로운 걸 발견할 기회야.",
    style:"고대 그리스의 아르키메데스. 호기심 많고 열정적이다. 직접 손으로 해보는 실험과 발견을 강조하고, 깨달으면 '유레카!'를 외친다." },
  { id:"choi", name:"최석정", era:"1646–1715 · 조선", sym:"方", color:"#9A3412", bg:"#FCF0E8", voice:"buttery",
    fact:"조선의 영의정이자 수학자. 『구수략』에서 마방진을 연구했고, 오일러보다 훨씬 앞서 직교 라틴 방진을 다뤘다.",
    hello:"수는 한 칸 한 칸 자리를 지킬 때 아름다워진다네. 차근차근 보세.",
    style:"조선의 학자 최석정. 차분하고 품위 있는 선비 말투(~하네, ~보세)를 살짝 섞되 4학년이 이해하기 쉽게. 자릿값과 꼼꼼함을 강조한다." },
  { id:"hong", name:"홍정하", era:"1684–? · 조선", sym:"算", color:"#B91C1C", bg:"#FDECEC", voice:"rounded",
    fact:"조선의 산학자. 『구일집』을 남겼고, 청나라 사신과의 수학 문답에서 실력을 보여줬다.",
    hello:"수학은 승부야. 어려운 문제일수록 도전할 맛이 나지! 오늘도 한판 붙어보자.",
    style:"조선의 산학자 홍정하. 자신감 넘치는 승부사. 도전과 승리를 강조하고, 틀린 문제는 '다음 판에 이길 전략'으로 설명한다." },
  { id:"ada", name:"에이다 러브레이스", era:"1815–1852 · 영국", sym:"{ }", color:"#7C3AED", bg:"#F3EEFF", voice:"airy",
    fact:"세계 최초의 컴퓨터 프로그램을 쓴 사람으로 꼽히는 수학자. 계산을 ‘단계별 명령’으로 생각했다.",
    hello:"모든 계산은 순서가 있는 단계야. 어느 단계에서 길을 잃었는지 같이 찾아보자.",
    style:"영국의 수학자 에이다 러브레이스. 논리적이고 다정하다. 풀이를 컴퓨터 알고리즘처럼 '1단계, 2단계'로 나누고 버그(실수)를 찾는 디버깅에 비유한다." },
  { id:"ramanujan", name:"라마누잔", era:"1887–1920 · 인도", sym:"∞", color:"#047857", bg:"#E7F6EF", voice:"buttery",
    fact:"거의 혼자 공부해서 놀라운 공식들을 찾아낸 천재. 1729라는 숫자의 특별함을 바로 알아본 일화로 유명하다.",
    hello:"모든 숫자에는 저마다 개성이 있어. 숫자랑 친해지면 실수도 줄어들 거야.",
    style:"인도의 수학자 라마누잔. 따뜻하고 숫자를 친구처럼 대한다. 숫자의 재미있는 성질을 짚어주며 설명한다." }
];
const S = { user:null, signedIn:false, loginErr:"", tts:("speechSynthesis" in window), canImg:true, ready:false, sessions:[], files:[], tab:"home", view:null, grading:false, openTag:null, delConfirm:null, err:"", mentorId:null, picking:false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const nums = s => (String(s ?? "").match(/\d+/g) || []).map(Number);
const sameNums = (a,b) => { const x=nums(a), y=nums(b); return x.length>0 && x.length===y.length && x.every((v,i)=>v===y[i]); };
const placeName = k => ["일","십","백","천","만"][k] || "";
const M = () => MENTORS.find(m=>m.id===S.mentorId) || MENTORS[0];
const avatar = (m, sm) => `<div class="av${sm?" sm":""}" style="background:${m.color}">${m.sym}</div>`;
function applyTheme(){ const m=M(); document.documentElement.style.setProperty("--acc", m.color); document.documentElement.style.setProperty("--accbg", m.bg); }

/* ---------- startup ---------- */
async function boot(){
  try { S.mentorId = localStorage.getItem("mentor"); } catch(_){}
  try { S.user = await backend.currentUser(); } catch(e){ S.loginErr = "로그인 정보를 확인하지 못했어요."; }
  S.signedIn = !!S.user;
  if (S.signedIn) await loadAll();
  S.ready = true; applyTheme(); render();
}
async function loadAll(){
  let done=false;
  const timer = setTimeout(()=>{ if(!done){ S.err="기록을 아직 불러오지 못했어요. 인터넷 연결을 확인해 주세요."; render(); } }, 10000);
  try {
    const [list, settings] = await Promise.all([backend.listSessions(), backend.getSettings().catch(()=>({}))]);
    S.sessions = list.filter(v=>Array.isArray(v.problems));
    if (settings.mentor && MENTORS.some(m=>m.id===settings.mentor)) S.mentorId = settings.mentor;
    S.err="";
  } catch(e){ S.err = (e && e.code==="permission-denied") ? "이 계정은 공부방 기록에 접근할 수 없어요. 허용된 계정으로 로그인해 주세요." : "기록을 불러오지 못했어요."; }
  done=true; clearTimeout(timer);
  if(!S.mentorId) S.picking = true;
}
async function saveSession(s){
  try { await backend.saveSession(s); }
  catch(e){ S.err = "기록 저장에 실패했어요. 인터넷 연결을 확인해 주세요."; render(); }
}
let saving = Promise.resolve();
function queueSave(s){ saving = saving.then(()=>saveSession(s)); }
async function setMentor(id){
  S.mentorId=id; S.picking=false; applyTheme();
  try { localStorage.setItem("mentor", id); } catch(_){}
  render(); window.scrollTo(0,0);
  saving = saving.then(()=>backend.setSettings({mentor:id}).catch(()=>{}));
}

/* ---------- stats (XP) ---------- */
function xpOf(s){ const pd = s.problems.reduce((a,p)=>a+(p.practiceDone||0),0); return s.correct*10 + (s.total>0 && s.correct===s.total ? 30 : 0) + pd*15; }
function totalXP(){ return S.sessions.reduce((a,s)=>a+xpOf(s),0); }
const LV = 300;
function level(){ const x=totalXP(); return { lv:Math.floor(x/LV)+1, cur:x%LV, xp:x }; }
function streak(){
  const set = new Set(S.sessions.map(s=>s.date)); if(!set.size) return 0;
  const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const d=new Date(); if(!set.has(fmt(d))) d.setDate(d.getDate()-1);
  let n=0; while(set.has(fmt(d))){ n++; d.setDate(d.getDate()-1); } return n;
}
function recount(s){ s.total = s.problems.length; s.correct = s.problems.filter(p=>p.status==="correct").length; }
function tagStats(){
  const now = Date.now(), m = {};
  for(const s of S.sessions) for(const p of s.problems){
    if(p.status!=="wrong" && p.status!=="incomplete") continue;
    for(const t of (p.tags&&p.tags.length?p.tags:["기타"])){
      const o = m[t] || (m[t]={tag:t,total:0,recent:0,practiced:0,items:[]});
      o.total++; if(now - s.ts < 14*864e5) o.recent++;
      o.practiced += (p.practiceDone||0); o.items.push({s,p});
    }
  }
  return Object.values(m).sort((a,b)=>b.recent-a.recent || b.total-a.total);
}
function pendingPractice(){
  const out=[];
  for(const s of S.sessions) for(const p of s.problems){
    if(p.status!=="wrong" && p.status!=="incomplete") continue;
    (p.practice||[]).forEach((q,i)=>{ if(!(p.practiceSolved||[]).includes(i)) out.push({s,p,i,q}); });
  }
  return out.slice(0,3);
}

/* ---------- image helpers ---------- */
async function loadBitmap(file){
  try { return await createImageBitmap(file, { imageOrientation:"from-image" }); }
  catch(e){ return await new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); }); }
}
function toCanvas(bmp, maxSide, crop){
  const sw = crop ? crop.w : bmp.width, sh = crop ? crop.h : bmp.height;
  const k = Math.min(1, maxSide / Math.max(sw, sh));
  const c = document.createElement("canvas"); c.width = Math.round(sw*k); c.height = Math.round(sh*k);
  c.getContext("2d").drawImage(bmp, crop?crop.x:0, crop?crop.y:0, sw, sh, 0, 0, c.width, c.height);
  return c;
}
const canvasBlob = (c,q) => new Promise(r=>c.toBlob(r,"image/jpeg",q));
function cropBox(bmp, box){
  if(!Array.isArray(box) || box.length!==4 || box.some(v=>typeof v!=="number" || !isFinite(v))) return null;
  let [x,y,w,h] = box; if(w<=0||h<=0||x>1||y>1) return null;
  const px = w*0.18, py = h*0.25;
  x=Math.max(0,x-px); y=Math.max(0,y-py); w=Math.min(1-x,w+2*px); h=Math.min(1-y,h+2*py);
  return toCanvas(bmp, 560, { x:x*bmp.width, y:y*bmp.height, w:w*bmp.width, h:h*bmp.height }).toDataURL("image/jpeg",0.7);
}

/* ---------- grading ---------- */
function fixProblem(p){
  p.tags = (Array.isArray(p.tags)?p.tags:[]).filter(t=>TAGS.includes(t));
  p.practice = (Array.isArray(p.practice)?p.practice:[]).filter(x=>x && x.q && x.a).slice(0,2);
  p.practiceDone = 0; p.practiceSolved = [];
  if(!["correct","wrong","incomplete","unclear"].includes(p.status)) p.status="unclear";
  const v = p.visual || {};
  let computed = null;
  if(v.kind==="long_division" && Number.isInteger(+v.dividend) && Number.isInteger(+v.divisor) && +v.divisor>0 && +v.dividend>0 && String(+v.dividend).length<=4){
    const q=Math.floor(v.dividend/v.divisor), r=v.dividend%v.divisor; computed = r ? `${q} … ${r}` : `${q}`;
  } else if(v.kind==="multiply" && Number.isInteger(+v.a) && Number.isInteger(+v.b) && +v.b>=0 && +v.b<=9 && String(+v.a).length<=4){
    computed = String(v.a*v.b);
  } else if(v.kind!=="steps") p.visual = {kind:"none"};
  if(computed && (p.type==="division"||p.type==="multiplication")){
    p.answer = computed;
    if(p.status!=="unclear" && nums(p.student).length){
      if(sameNums(p.student, computed)) { p.status="correct"; p.tags=[]; p.practice=[]; }
      else if(p.status==="correct") p.status="wrong";
    }
  }
  return p;
}
async function grade(){
  if(!S.files.length || S.grading) return;
  S.grading = true; S.err=""; S.progress = {i:0,n:S.files.length}; render();
  const batch=[];
  for(let i=0;i<S.files.length;i++){
    S.progress.i=i; render();
    try{
      const bmp = await loadBitmap(S.files[i]);
      const send = await canvasBlob(toCanvas(bmp,1600),0.85);
      const res = await backend.grade(send, S.mentorId || "gauss");
      if(!res || !Array.isArray(res.problems) || !res.problems.length) throw {code:"empty"};
      const problems = res.problems.map(fixProblem);
      for(const p of problems){ if(p.status!=="correct") p.crop = cropBox(bmp, p.box); }
      const s = { id:"s"+Date.now()+Math.random().toString(36).slice(2,6), ts:Date.now(), date:today(), mentor:S.mentorId,
        sheet:String(res.sheet||"수학 학습지").slice(0,60), praise:String(res.overall_praise||""), tip:String(res.habit_tip||""),
        thumb: toCanvas(bmp,900).toDataURL("image/jpeg",0.6), problems };
      recount(s); S.sessions.unshift(s); batch.push(s); queueSave(s);
    }catch(e){
      const c = e && e.code;
      S.err = c==="daily_limit" ? (e.message || "오늘 채점 한도를 다 썼어요. 내일 다시 해요.")
        : c==="not_allowed" || c==="unauthorized" ? "이 계정은 채점을 사용할 수 없어요. 허용된 계정으로 로그인해 주세요."
        : c==="network" ? "채점 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요."
        : c==="busy" ? "무료 채점 사용량이 잠깐 꽉 찼어요. 몇 분 뒤에 다시 해 주세요."
        : c==="bad_image" ? "사진을 읽을 수 없어요. 다른 사진으로 해볼까요?"
        : c==="empty" ? "사진에서 문제를 찾지 못했어요. 학습지 전체가 잘 보이게 다시 찍어주세요."
        : `채점 중에 문제가 생겼어요. 다시 시도해 주세요. (${c || "unknown"}${e && e.status ? " " + e.status : ""})`;
      if(["daily_limit","not_allowed","unauthorized","network","busy"].includes(c)) break;
    }
  }
  S.grading=false; S.files=[];
  if(batch.length){ S.view = {type:"result", ids:batch.map(b=>b.id)}; toast(`+${batch.reduce((a,s)=>a+xpOf(s),0)} XP`); }
  render(); window.scrollTo(0,0);
}

/* ---------- visual frames ---------- */
const INK="#111827", HOT=()=>M().color, HOTBG=()=>M().bg, GOOD="#15803D", GOODBG="#E8F6EC", FAINT="#9CA3AF";
const NUMSTYLE = 'font-family:"IBM Plex Sans KR",sans-serif;font-weight:600;font-size:28px';
function divFrames(dividend, divisor){
  const D=String(dividend).split("").map(Number), n=D.length, steps=[];
  let cur=0, started=false;
  for(let i=0;i<n;i++){ cur=cur*10+D[i]; const q=Math.floor(cur/divisor); if(!started && q===0 && i<n-1) continue; started=true; steps.push({i,cur,q,prod:q*divisor,rem:cur-q*divisor}); cur-=q*divisor; }
  const Q=Math.floor(dividend/divisor), R=dividend%divisor;
  let r=2; steps.forEach(s=>{ s.prodRow=r; s.nextRow=r+1; r+=2; });
  const X0=120, CW=38, W=Math.max(340, X0+n*CW+60), H=58+r*44;
  const cx=c=>X0+c*CW+CW/2, ry=k=>48+k*44, el=[];
  steps.forEach((s,k)=>{
    el.push({f:2*k,row:0,end:s.i,str:String(s.q)});
    el.push({f:2*k+1,row:s.prodRow,end:s.i,str:String(s.prod)});
    el.push({f:2*k+1,line:true,row:s.prodRow,from:s.i-String(s.cur).length+1,to:s.i});
    const nx=steps[k+1];
    if(nx) el.push({f:2*k+1,row:s.nextRow,end:nx.i,str:String(nx.cur),down:nx.i});
    else el.push({f:2*k+1,row:s.nextRow,end:s.i,str:String(s.rem)});
  });
  const curPos = k => k===0 ? {row:1,from:0,to:steps[0].i} : {row:steps[k-1].nextRow,from:steps[k].i-String(steps[k].cur).length+1,to:steps[k].i};
  const nf = steps.length*2+1, frames=[];
  for(let f=0; f<nf; f++){
    let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${dividend} 나누기 ${divisor} 세로셈">`;
    const k=Math.floor(f/2), isA=f%2===0, final=f===nf-1;
    if(!final && isA){ const c=curPos(k); g+=`<rect x="${cx(c.from)-CW/2+2}" y="${ry(c.row)-30}" width="${(c.to-c.from+1)*CW-4}" height="40" rx="8" fill="${HOTBG()}"/><rect x="${X0-58}" y="${ry(1)-30}" width="40" height="40" rx="8" fill="${HOTBG()}"/>`; }
    if(final) g+=`<rect x="${X0}" y="${ry(0)-32}" width="${n*CW}" height="42" rx="8" fill="${GOODBG}"/>`;
    g+=`<text x="${X0-22}" y="${ry(1)}" text-anchor="end" style="${NUMSTYLE}" fill="${INK}">${divisor}</text>`;
    g+=`<path d="M${X0-12} ${ry(1)-32} Q${X0+2} ${ry(1)-12} ${X0-12} ${ry(1)+10}" fill="none" stroke="${INK}" stroke-width="2"/>`;
    g+=`<line x1="${X0-12}" y1="${ry(1)-32}" x2="${X0+n*CW+8}" y2="${ry(1)-32}" stroke="${INK}" stroke-width="2"/>`;
    D.forEach((d,i)=>{ g+=`<text x="${cx(i)}" y="${ry(1)}" text-anchor="middle" style="${NUMSTYLE}" fill="${INK}">${d}</text>`; });
    for(const e of el){
      if(e.f>f) continue;
      const hot = e.f===f && !final;
      const color = hot ? HOT() : (final && e.row===0 ? GOOD : INK);

function practiceRow(s,p,j,q){
  const pi = s.problems.indexOf(p), key=`${s.id}-${pi}-${j}`, done=(p.practiceSolved||[]).includes(j);
  return `<div class="row" style="flex-wrap:wrap;margin:8px 0"><span class="num" style="font-size:18px;font-weight:700;min-width:120px">${esc(q.q)} =</span>
  ${done?`<span class="fb ok">${esc(q.a)} · 정답 ✓</span>`:`<input type="text" id="pr-${key}" inputmode="numeric" placeholder="답"><button class="mini pri" data-act="prac" data-s="${s.id}" data-i="${pi}" data-j="${j}">확인</button><span class="fb" id="fb-${key}"></span>`}</div>`;
}
function histRow(s){
  const del = S.delConfirm===s.id, pct = s.total?Math.round(s.correct/s.total*100):0;
  return `<div class="hist" data-act="open" data-id="${s.id}">${s.thumb?`<img src="${s.thumb}" alt="">`:""}
  <div style="flex:1;min-width:0"><div class="row" style="gap:8px"><b class="num">${s.correct}/${s.total}</b><span class="pill ${pct===100?"ok":""}">${pct}%</span></div><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.date)} · ${esc(s.sheet)}</div></div>
  ${S.tab==="history" ? (del?`<button class="mini" style="background:var(--bad);border-color:var(--bad);color:#fff" data-act="delyes" data-id="${s.id}">삭제</button><button class="mini" data-act="delno">취소</button>`:`<button class="ghost" data-act="del" data-id="${s.id}">삭제</button>`) : ""}</div>`;
}
function historyView(){
  let h=`<div class="card"><h2>기록</h2>`;
  if(!S.sessions.length) return h+`<p class="muted">아직 기록이 없어요.</p></div>`;
  let last="";
  S.sessions.forEach(s=>{ if(s.date!==last){ h+=`<div class="label" style="margin-top:12px">${esc(s.date)}</div>`; last=s.date; } h+=histRow(s); });
  return h+`</div>`;
}
function weakView(){
  const ts=tagStats();
  const wk = d => S.sessions.filter(s=>Date.now()-s.ts >= d*7*864e5 && Date.now()-s.ts < (d+1)*7*864e5);
  const acc = arr => { const t=arr.reduce((a,s)=>a+s.total,0), c=arr.reduce((a,s)=>a+s.correct,0); return t? Math.round(c/t*100) : null; };
  const a0=acc(wk(0)), a1=acc(wk(1));
  const diff = (a0!=null && a1!=null) ? a0-a1 : null;
  let h=`<div style="padding:4px 2px"><div class="label">부모용</div><h2 style="font-size:24px">학습 분석</h2></div>
  <div class="card"><div class="row"><div class="stat"><b class="num">${wk(0).length}</b><span>이번 주 학습지</span></div><div class="stat"><b class="num">${a0??"–"}${a0!=null?"%":""}</b><span>이번 주 정답률</span></div><div class="stat"><b class="num" style="color:${diff==null?"inherit":diff>=0?"var(--ok)":"var(--bad)"}">${diff==null?"–":(diff>=0?"+":"")+diff+"%p"}</b><span>지난주 대비</span></div></div></div>`;
  h+=`<div class="card"><h3>실수 유형</h3><p class="muted" style="margin:4px 0 6px">2주 안에 같은 유형이 3번 이상이면 ‘반복’으로 표시해요. 항목을 누르면 실제 문제가 보여요.</p>`;
  if(!ts.length) h+=`<p class="muted">아직 틀린 문제 기록이 없어요.</p>`;
  const max = Math.max(1,...ts.map(t=>t.total));
  ts.forEach(t=>{
    const st = t.recent>=3 ? `<span class="pill warn">반복</span>` : (t.practiced>=Math.max(2,t.recent) ? `<span class="pill ok">극복 중</span>` : "");
    h+=`<div class="tagrow" data-act="tag" data-t="${esc(t.tag)}"><div class="row between"><b>${esc(t.tag)}</b>${st}</div>
    <div class="row" style="margin-top:6px"><div class="bar"><i style="width:${t.total/max*100}%"></i></div><span class="muted num" style="min-width:150px;text-align:right">전체 ${t.total} · 최근 ${t.recent} · 연습 ${t.practiced}</span></div>`;
    if(S.openTag===t.tag){ h+=`<div style="margin-top:8px">`; t.items.slice(0,6).forEach(({s,p})=>{ h+=`<div class="muted" style="padding:3px 0">${esc(s.date)} · ${esc(p.no)} ${esc(p.question)} → <b style="color:var(--bad)">${esc(p.student||"빈칸")}</b> / 정답 <b style="color:var(--ok)">${esc(p.answer)}</b>${p.where?` — ${esc(p.where)}`:""}</div>`; }); h+=`</div>`; }
    h+=`</div>`;
  });
  h+=`</div>`;
  const top = ts.filter(t=>t.recent>=3)[0];
  if(top) h+=`<div class="card"><h3>대화 가이드</h3><p style="margin:8px 0">"${KID}아, 요즘 <b>${esc(top.tag)}</b>에서 자꾸 걸리던데, 오늘 미션 3개만 같이 끝내볼까?"</p><p class="muted">실수를 지적하기보다, 스스로 실수를 찾아낸 순간을 칭찬해 주세요.</p></div>`;
  return h;
}
function meView(){
  const m=M(), L=level(), ss=S.sessions, ts=tagStats(), st=streak();
  const perfect = ss.filter(s=>s.total>0&&s.correct===s.total).length;
  const solved = ss.reduce((a,s)=>a+s.problems.reduce((b,p)=>b+(p.practiceDone||0),0),0);
  const pr = t => ts.find(x=>x.tag===t)?.practiced||0;
  const B=[["◎","첫 채점",ss.length>=1],["100","첫 만점",perfect>=1],["×5","만점 5회",perfect>=5],["3d","3일 연속",st>=3],["7d","7일 연속",st>=7],["20","학습지 20장",ss.length>=20],
    ["↻","재도전 10문제",solved>=10],["↻↻","재도전 30문제",solved>=30],["Lv5","레벨 5",L.lv>=5],["+↑","받아올림 정복",pr("받아올림 실수")>=3],["0","0의 비밀",pr("0 처리")>=3],["…","나머지 정복",pr("나머지 실수")>=3]];
  let h=`<div class="card"><div class="row">${avatar(m)}<div style="flex:1"><div class="label">나의 멘토</div><div style="font-weight:700;font-size:18px">${m.name}</div><div class="muted">${m.era}</div></div><button class="mini" data-act="pick">변경</button></div><p style="margin:10px 0 0;font-size:14px">${m.fact}</p></div>
  <div class="card"><div class="row between"><div><div class="label">로그인 계정</div><div style="font-weight:600">${esc(S.user&&(S.user.email||S.user.displayName)||"")}</div></div><button class="mini" data-act="logout">로그아웃</button></div></div>
  <div class="card"><div class="row between"><h3>레벨</h3><span class="num" style="font-weight:700">Lv.${L.lv}</span></div><div class="lvl" style="height:10px"><i style="width:${L.cur/LV*100}%"></i></div><p class="muted num" style="margin:6px 0 0">다음 레벨까지 ${LV-L.cur} XP · 정답 10 · 만점 보너스 30 · 재도전 15</p></div>
  <div class="card"><h3 style="margin-bottom:10px">업적</h3><div class="grid3">`;
  B.forEach(([e,n,ok])=>h+=`<div class="badge ${ok?"":"off"}"><span class="e num" style="color:${ok?m.color:"inherit"}">${e}</span>${n}</div>`);
  return h+`</div></div>`;
}

/* ---------- effects ---------- */
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2300); }
function say(text){
  if(!S.tts) return;
  const clean = String(text).replace(/<[^>]+>/g," ").replace(/×/g," 곱하기 ").replace(/÷/g," 나누기 ").replace(/−/g," 빼기 ").replace(/…/g," 나머지 ").replace(/=/g," 는 ").replace(/\s+/g," ").trim();
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean); u.lang="ko-KR"; u.rate=0.95;
    const v = speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  } catch(_){}
}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; S.tab=b.dataset.tab; S.view=null; S.picking=false; S.delConfirm=null; render(); window.scrollTo(0,0); });
$("#file").addEventListener("change", e=>{ S.files=[...e.target.files].slice(0,6); e.target.value=""; render(); });
document.getElementById("app").addEventListener("click", async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, sid=t.dataset.s, find=id=>S.sessions.find(s=>s.id===id);
  if(a==="login"){ S.loginErr=""; try{ S.user=await backend.login(); S.signedIn=!!S.user; if(S.signedIn){ S.ready=false; render(); await loadAll(); S.ready=true; } }catch(err){ S.loginErr="로그인하지 못했어요. 다시 시도해 주세요."; } render(); }
  else if(a==="logout"){ await backend.logout(); S.user=null; S.signedIn=false; S.sessions=[]; render(); }
  else if(a==="tab"){ S.tab=t.dataset.t; S.view=null; render(); window.scrollTo(0,0); }
  else if(a==="pick"){ S.picking=true; render(); window.scrollTo(0,0); }
  else if(a==="unpick"){ S.picking=false; render(); }
  else if(a==="mentor") setMentor(t.dataset.id);
  else if(a==="file") $("#file").click();
  else if(a==="clear"){ S.files=[]; render(); }
  else if(a==="grade") grade();
  else if(a==="close"){ S.view=null; render(); }
  else if(a==="open"){ if(e.target.closest("button")) return; S.view={type:"result",ids:[t.dataset.id]}; render(); window.scrollTo(0,0); }
  else if(a==="jump"){ const el=document.getElementById("p-"+t.dataset.id); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); }
  else if(a==="stnext"||a==="stprev"){ const k=t.dataset.k, st=STEPPERS[k]; st.i = a==="stnext" ? (st.i+1)%st.frames.length : Math.max(0,st.i-1); document.getElementById("st-"+k).innerHTML=stepperInner(k); }
  else if(a==="stsay"){ const st=STEPPERS[t.dataset.k]; say(st.frames[st.i].text); }
  else if(a==="say") say(t.dataset.text);
  else if(a==="tag"){ S.openTag = S.openTag===t.dataset.t ? null : t.dataset.t; render(); }
  else if(a==="del"){ S.delConfirm=t.dataset.id; render(); }
  else if(a==="delno"){ S.delConfirm=null; render(); }
  else if(a==="delyes"){ const id=t.dataset.id; S.sessions=S.sessions.filter(s=>s.id!==id); S.delConfirm=null; render(); try{ await backend.deleteSession(id); }catch(_){ S.err="삭제에 실패했어요."; render(); } }
  else if(a==="flip"){ const s=find(sid), p=s.problems[+t.dataset.i];
    if(p.status==="correct") p.status="wrong"; else { p.status="correct"; p.tags=[]; }
    p.override=true; recount(s); queueSave(s); render(); }
  else if(a==="unclear"){ const s=find(sid), i=+t.dataset.i, p=s.problems[i], key=`${s.id}-${i}`, v=($("#un-"+key)||{}).value||"";
    if(!v.trim()){ $("#unerr-"+key).textContent="답을 먼저 입력해 줘."; return; }
    p.student=v.trim(); p.status = sameNums(p.student,p.answer) ? "correct" : "wrong";
    if(p.status==="correct"){ p.tags=[]; toast("+10 XP"); }
    recount(s); queueSave(s); render(); }
  else if(a==="prac"){ const s=find(sid), p=s.problems[+t.dataset.i], j=+t.dataset.j, key=`${s.id}-${t.dataset.i}-${j}`;
    const inp=$("#pr-"+key), fb=$("#fb-"+key), v=(inp&&inp.value||"").trim();
    if(!v){ fb.className="fb no"; fb.textContent="답을 먼저 입력해 줘."; return; }
    if(sameNums(v, p.practice[j].a)){ p.practiceSolved=[...(p.practiceSolved||[]), j]; p.practiceDone=(p.practiceDone||0)+1; toast("정답! +15 XP"); queueSave(s); render(); }
    else { fb.className="fb no"; fb.textContent="아깝다. 풀이 과정을 한 번 더 보고 다시!"; }
  }
});
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
document.getElementById("app").addEventListener("input", e=>{ const id=e.target.id||""; if(id.startsWith("pr-")){ const fb=$("#fb-"+id.slice(3)); if(fb) fb.textContent=""; } if(id.startsWith("un-")){ const er=$("#unerr-"+id.slice(3)); if(er) er.textContent=""; } });
render();
boot();
</script>
